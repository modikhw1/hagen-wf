<!doctype html><html lang="sv"><meta charset="utf-8"><title>Notan – förvärld</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:14px system-ui;background:#202020;color:#eee;margin:18px}button,select,input{margin:4px;padding:5px}#views{display:flex;gap:10px;align-items:flex-start}canvas,video{width:288px;height:512px;background:#111;image-rendering:pixelated}#status{white-space:pre-wrap;max-width:800px}#scrub{width:min(600px,80vw)}.label{margin-bottom:5px}#sourceBox[hidden]{display:none}button:disabled{opacity:.5}main{display:flex;gap:24px;align-items:flex-start}#chatPanel{width:430px;background:#292e31;padding:16px;border-radius:8px}#messages{max-height:330px;overflow:auto}.message{padding:10px;margin:8px 0;background:#394447;border-radius:6px;white-space:pre-wrap}.cm{background:#21434d}#sentence{width:310px}pre{font-size:11px;white-space:pre-wrap}#editList{padding-left:24px}h4{margin-bottom:8px}@media(max-width:1050px){main{flex-wrap:wrap}} </style>
<h3>Notan: samma scen i förvärld och PS2-vy</h3>
<div><button id="play">Spela / pausa</button><input id="scrub" type="range" min="0" max="382" step="1" value="0"><span id="clock"></span></div>
<div><label><input id="ps2" type="checkbox" checked> PS2 / vanlig</label><label><input id="plate" type="checkbox" checked> Plåt / möblerad mall</label><label><input id="occlusion" type="checkbox" checked> Uppmätt synlighetsmask (plåtvy)</label><label><input id="side" type="checkbox" checked> Källa bredvid</label></div>
<div><label><input id="hair" type="checkbox" checked> Källhuvud och hår (huvudfäst kort)</label><label><input id="layers" type="checkbox" checked> Pappersteater: förgrund i mallrum</label></div>
<div><label><input id="live" type="checkbox" checked> Levande källtextur</label><label><input id="hands" type="checkbox" checked> Dynamiska handkort</label></div>
<div><button id="tint">Byt A:s färg</button><button id="text">Ändra text i s1</button><button id="camera">Stativkamera i aktuell scen</button><button id="pipeline">Ta bort s2 direkt</button><button id="undo">Ångra</button><button id="download">Spara regi.json</button><button id="reset">Återställ</button><button id="quality">Kvalitetskontroll</button></div>
<div id="kompStatus" style="font-size:12px;opacity:.85;margin:2px 4px">kompilerad: –</div><div id="qualStatus" style="font-size:12px;opacity:.85;margin:2px 4px"></div>
<main><div id="views"><div><div class="label" id="viewLabel">Laddar paket…</div><div id="viewport"></div></div><div id="sourceBox"><div class="label">Källa, samma källruta</div><video id="source" muted playsinline preload="auto" src="/paket/notan/source.mp4"></video></div></div>
<section id="chatPanel"><h3>Prata med världen</h3><p>Skriv en ändring. Släpp en bild här för en ny bakgrund. Allt sparas lokalt.</p><div id="messages" aria-live="polite"></div><form id="chatForm"><input id="sentence" placeholder='Exempel: kom närmare B i scen 7' autocomplete="off" required><button id="send">Ändra</button></form><label>Bakgrundsbild <input id="upload" type="file" accept="image/png,image/jpeg,image/webp"></label><h4>Gjorda ändringar</h4><ol id="editList"></ol><details><summary>Regi JSON</summary><pre id="regiJson"></pre></details></section></main><p id="status">Laddar…</p><audio id="audio" preload="auto" src="/paket/notan/audio.m4a"></audio>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js"}}</script><script type="module" src="/viewer.js"></script></html>
