<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notan · Scen3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171b20;color:#eee8dc;font:14px system-ui,sans-serif;display:grid;grid-template-columns:1fr 310px;height:100vh;overflow:hidden}#stage{display:flex;justify-content:center;align-items:center;min-width:0;background:#101419;position:relative}canvas{height:100%;max-width:100%;object-fit:contain}aside{padding:28px 24px;background:#20262d;border-left:1px solid #343b42;display:flex;flex-direction:column;gap:20px}h1{font-size:27px;letter-spacing:-1px;margin:0}small,.muted{color:#aab4be;line-height:1.6}button,select{background:#323c47;border:1px solid #4b5866;border-radius:7px;color:inherit;padding:10px;cursor:pointer}button.active{background:#836746}label{display:flex;gap:9px;align-items:center}input[type=range]{width:100%;accent-color:#dbb87b}#caption{position:absolute;bottom:7%;max-width:85%;text-align:center;font-size:clamp(16px,2.2vh,25px);font-weight:600;background:#151a20dd;border-radius:8px;padding:10px 16px;pointer-events:none}#caption .osagt{opacity:.45}#caption .roll{color:#dbb87b;font-weight:700;margin-right:4px}#caption .sagt{opacity:1}#status{white-space:pre-line;font-family:monospace;font-size:12px;line-height:1.7}#note{margin-top:auto}.capture{display:block!important;background:black!important}.capture aside,.capture #caption{display:none}.capture.medtext #caption{display:block;bottom:30%;font-size:24px;background:#000000aa}.capture #stage{width:576px;height:1024px}.capture canvas{width:576px;height:1024px}@media(max-width:700px){body{grid-template-columns:1fr;grid-template-rows:1fr 160px}aside{padding:12px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}aside header,#note,#status{display:none}}
</style>
<style>#stage{min-height:0;height:100%;overflow:hidden}canvas{width:auto;max-height:100%}body{grid-template-rows:minmax(0,1fr)}@media(max-width:700px){body{grid-template-rows:minmax(0,1fr) 160px}}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<main id="stage"><div id="caption"></div></main><aside><header><small>SCEN3D / FAS 2</small><h1>Vem tar notan?</h1><p class="muted">En scen. Sju kameror.<br>Rörelse från originalklippet.</p></header>
<button id="play">Spela</button><div><input id="timeline" type="range" min="0" max="12.7667" step="0.033333"><small id="time"></small></div>
<label><input id="audio" type="checkbox"> Ljud</label><select id="ljud" aria-label="Ljud"><option value="designed">Designade röster</option><option value="original">Originalljud</option></select><label><input id="captions" type="checkbox" checked> Textning</label>
<button id="orbit">Fri kamera</button><select id="shot" aria-label="Kamera"></select><select id="avatar" aria-label="Avatar"><option value="xbot">Neutrala dockor (X Bot)</option><option value="procedural">Rundade figurer</option><option value="vrm">VRM / Kalidokit · jämförelse</option></select>
<div id="status">Laddar lokal scen…</div><small id="note">Dra för att rotera i fri kamera. Hjul zoomar.<br>Ändra <b>scen3d.json</b> för direkt uppdatering.<br>Alla modeller och bibliotek finns lokalt.</small></aside><script type="module" src="./player.js"></script></body></html>
