<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scen 2,5D</title>
<style>
  :root { --bg:#14161a; --yta:#1d2026; --linje:#2c313a; --text:#e6e8eb; --dim:#8a919c; --acc:#e0b04a; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 system-ui, sans-serif }
  main { display:grid; grid-template-columns:380px 1fr; gap:16px; padding:16px; max-width:1200px; margin:auto }
  @media (max-width:820px){ main{ grid-template-columns:1fr } }
  canvas { width:360px; height:640px; background:#000; border-radius:8px; display:block }
  .rad { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0 }
  button, label { background:var(--yta); color:var(--text); border:1px solid var(--linje); border-radius:6px; padding:5px 9px; font:inherit; cursor:pointer }
  .tid { display:flex; height:42px; border:1px solid var(--linje); border-radius:6px; overflow:hidden; position:relative; margin:8px 0 }
  .tid div { border-right:1px solid var(--bg); padding:3px 5px; font-size:11px; overflow:hidden; white-space:nowrap; cursor:pointer; background:#2a2f38 }
  .tid .spel { position:absolute; top:0; bottom:0; width:2px; background:#fff; padding:0; border:0 }
  .kort { background:var(--yta); border:1px solid var(--linje); border-radius:8px; padding:10px 12px; margin:8px 0 }
  table { border-collapse:collapse; width:100%; font-size:12px } td,th { text-align:left; padding:2px 6px; border-bottom:1px solid var(--linje) }
  .dim { color:var(--dim) } code { background:#0c0d10; padding:1px 4px; border-radius:4px }
  #logg div { padding:2px 0; border-bottom:1px dashed var(--linje) }
</style>
</head>
<body>
<main>
  <section>
    <canvas id="c" width="576" height="1024"></canvas>
    <div class="rad">
      <button id="spela">⏸</button>
      <label><input type="checkbox" id="text" checked> repliker</label>
      <label><input type="checkbox" id="skiktvy"> visa skikt</label>
      <span class="dim" id="tidtext"></span>
    </div>
  </section>
  <section>
    <div class="dim">Läser <code>scen25d.json</code> varje sekund. Ändringar i filen syns direkt.</div>
    <div class="tid" id="tid"></div>
    <div class="kort"><b>Scen</b> <span class="dim" id="scenrubrik"></span><div id="scen"></div></div>
    <div class="kort"><b>Ändringslogg</b><div id="logg"></div></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const cv = $('#c'), g = cv.getContext('2d'); const W = 576, H = 1024;
let S = null, text = '', bilder = {}, T = 0, t0 = performance.now(), spelar = true;
async function ladda(){
  try {
    const r = await fetch(new URLSearchParams(location.hash.slice(1)).get('fil') || 'scen25d.json', {cache:'no-store'}); const nytt = await r.text();
    if (nytt === text) return; text = nytt; S = JSON.parse(nytt);
    for (const sc of S.scener) for (const sk of sc.skikt) bild(sk.bild);
    ritaTid(); ritaLogg(); rita.senast = null;
  } catch(e){ console.warn(e); }
}
function bild(src){ if (!bilder[src]){ const i = new Image(); i.src = src + '?v=' + Date.now(); bilder[src] = i; } return bilder[src]; }
function total(){ return S.scener.reduce((a, s) => a + s.langd, 0); }
function scenVid(t){ let a = 0; for (let k = 0; k < S.scener.length; k++){ const s = S.scener[k]; if (t < a + s.langd) return {s, k, tau: t - a}; a += s.langd; } return null; }
function ritaTid(){
  const L = total();
  $('#tid').innerHTML = S.scener.map((s, k) => `<div data-k="${k}" style="width:${s.langd / L * 100}%">${s.id} · ${s.vem} · ${s.langd.toFixed(1)}s<br>${s.takt}</div>`).join('') + '<div class="spel" id="spelh"></div>';
  $('#tid').querySelectorAll('[data-k]').forEach(el => el.onclick = () => { T = S.scener.slice(0, +el.dataset.k).reduce((a, s) => a + s.langd, 0) + 0.01; t0 = performance.now() - T * 1000; });
}
function ritaLogg(){ $('#logg').innerHTML = (S.logg || []).slice().reverse().map(l => `<div><b>${l.vem}</b>: ${l.vad}</div>`).join(''); }
const ease = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
function rorelseVid(sk, tauO){
  const r = sk.rorelse; if (!r || !r.spar?.length) return {dx:0, dy:0, ds:1, rot:0};
  let b = r.spar[0]; for (const x of r.spar){ if (x[0] <= tauO) b = x; else break; }
  const st = sk.rorelse_styrka ?? 1;
  return {dx: b[1] * st, dy: b[2] * st, ds: 1 + (b[3] - 1) * st, rot: b[4] * st};
}
function rita(){
  if (!S) return requestAnimationFrame(rita);
  if (spelar) T = (performance.now() - t0) / 1000;
  const L = total(); const t = ((T % L) + L) % L; const hit = scenVid(t); if (!hit) return requestAnimationFrame(rita);
  const {s, k, tau} = hit; const p = ease(Math.min(1, tau / s.langd));
  const tauO = tau * ((s.orig.ut - s.orig.in) / s.langd);
  const c0 = s.kamera.start, c1 = s.kamera.slut;
  const cam = {x: c0.x + (c1.x - c0.x) * p, y: c0.y + (c1.y - c0.y) * p, zoom: c0.zoom + (c1.zoom - c0.zoom) * p};
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#f2eee6'; g.fillRect(0, 0, W, H);
  const personer = {};
  const yta = k => (k.ruta[2] - k.ruta[0]) * (k.ruta[3] - k.ruta[1]);
  for (const sk of s.skikt.slice().sort((a, b) => (a.z - b.z) || (yta(b) - yta(a)))){
    if (sk.synlig === false) continue;
    const im = bild(sk.bild); if (!im.complete || !im.naturalWidth) continue;
    const z = Math.min(1, sk.z ?? 0);
    // parallax: närmare skikt flyttas och zoomas mer
    const px = -cam.x * W * (0.25 + 0.75 * z), py = -cam.y * H * (0.25 + 0.75 * z);
    const zs = 1 + (cam.zoom - 1) * (0.35 + 0.65 * z);
    let [x0, y0, x1, y1] = sk.ruta; x0 *= W; x1 *= W; y0 *= H; y1 *= H;
    let bw = x1 - x0, bh = y1 - y0;
    // bytt bild: passa in i rutan med bibehållen form, förankrad i nederkant
    const ar = im.naturalWidth / im.naturalHeight;
    if (sk.bytt){ const nw = Math.min(bw, bh * ar), nh = nw / ar; x0 += (bw - nw) / 2; y0 += bh - nh; bw = nw; bh = nh; }
    const fl = sk.flytt || [0, 0], sc = sk.skala ?? 1;
    g.save();
    g.translate(W / 2, H / 2); g.scale(zs, zs); g.translate(-W / 2 + px, -H / 2 + py);
    let m = {dx:0, dy:0, ds:1, rot:0};
    if (sk.typ === 'person'){ m = rorelseVid(sk, tauO); personer[sk.id] = m; }
    if (sk.fast_vid && personer[sk.fast_vid]) m = personer[sk.fast_vid];
    const ax = (sk.ankare ? sk.ankare[0] * W : x0 + bw / 2) + fl[0] * W, ay = (sk.ankare ? sk.ankare[1] * H : y0 + bh * 0.3) + fl[1] * H;
    g.translate(ax + m.dx * W, ay + m.dy * H); g.rotate(m.rot * Math.PI / 180 * 0.6); g.scale(sc * m.ds * (sk.spegel ? -1 : 1), sc * m.ds);
    g.translate(-(x0 + bw / 2), -(y0 + bh * 0.3));
    g.drawImage(im, x0, y0, bw, bh);
    if ($('#skiktvy').checked){ g.strokeStyle = sk.typ === 'person' ? '#e07a5a' : sk.typ === 'foremal' ? '#5fbf7f' : '#6aa8e0'; g.lineWidth = 2; g.strokeRect(x0, y0, bw, bh); g.fillStyle = g.strokeStyle; g.font = '16px system-ui'; g.fillText(sk.id.split('.')[1] + (sk.klass ? ' ' + sk.klass : ''), x0 + 4, y0 + 16); }
    g.restore();
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  if ($('#text').checked && s.replik){ g.font = 'bold 22px system-ui'; g.textAlign = 'center'; const rader = radbryt(s.replik, 30);
    rader.forEach((r, i) => { const y = H * 0.62 + i * 28; g.lineWidth = 5; g.strokeStyle = '#000'; g.strokeText(r, W / 2, y); g.fillStyle = '#fff'; g.fillText(r, W / 2, y); }); g.textAlign = 'left'; }
  g.fillStyle = '#000a'; g.fillRect(0, 0, W, 34); g.fillStyle = '#fff'; g.font = '18px system-ui';
  g.fillText(`${s.id} · ${s.vem} · ${s.takt} · ${s.utsnitt}`, 10, 23);
  const sp = $('#spelh'); if (sp) sp.style.left = (t / L * 100) + '%';
  $('#tidtext').textContent = `${t.toFixed(1)} / ${L.toFixed(1)} s`;
  if (rita.senast !== s.id){ rita.senast = s.id; $('#scenrubrik').textContent = `${s.id} · ${s.handling}`;
    $('#scen').innerHTML = '<table><tr><th>skikt</th><th>typ</th><th>klass</th><th>z</th><th>ändrat</th></tr>' + s.skikt.map(sk => `<tr><td>${sk.id}</td><td>${sk.typ}</td><td>${sk.klass || sk.roll || ''}${sk.karna ? ' *' : ''}</td><td>${(sk.z ?? 0).toFixed(2)}</td><td>${[sk.bytt ? 'bytt' : '', (sk.flytt && (sk.flytt[0] || sk.flytt[1])) ? 'flyttad' : '', sk.synlig === false ? 'dold' : '', sk.spegel ? 'speglad' : '', (sk.skala ?? 1) !== 1 ? 'skala ' + sk.skala : ''].filter(Boolean).join(', ')}</td></tr>`).join('') + '</table>' +
      `<div class="dim" style="margin-top:6px">rum: ${(s.rum || []).map(r => r.etikett).join(', ')} · kamera ${JSON.stringify(s.kamera.start)} → ${JSON.stringify(s.kamera.slut)}</div>`; }
  requestAnimationFrame(rita);
}
function radbryt(t, n){ const ord = t.split(' '), ut = []; let r = ''; for (const o of ord){ if ((r + ' ' + o).trim().length > n){ ut.push(r.trim()); r = o; } else r += ' ' + o; } if (r.trim()) ut.push(r.trim()); return ut; }
$('#spela').onclick = () => { spelar = !spelar; $('#spela').textContent = spelar ? '⏸' : '▶'; if (spelar) t0 = performance.now() - T * 1000; };
const h = new URLSearchParams(location.hash.slice(1)); if (h.has('t')){ spelar = false; T = +h.get('t'); } if (h.has('skikt')) $('#skiktvy').checked = true;
ladda().then(() => requestAnimationFrame(rita)); setInterval(ladda, 1000);
</script>
</body>
</html>
